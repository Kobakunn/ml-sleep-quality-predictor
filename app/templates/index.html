<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>睡眠の質診断アプリ</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <div class="container">
        
        <h1 style="color: blueviolet; margin-bottom: 20px; text-align: center;">睡眠の質診断アプリ</h1>

        <div>
            <p class="description">
                生活習慣データを入力すると、あなたの睡眠の質を1～10で判定します。
            </p>
        </div>
        
        <div class="card">
            <div class="card-header">
                診断フォーム（以下記入欄に入力してください↓）
            </div>
            <form action="{{url_for('predict')}}" method="POST" class="card-body">

                <div class="form-group">
                    <label for="height">身長 (cm)</label>
                    <input type="number" id="height" name="height" class="form-control" step="0.1" value="171.0" min="100" max="220">
                </div>

                <div class="form-group">
                    <label for="weight">体重 (kg)</label>
                    <input type="number" id="weight" name="weight" class="form-control" step="0.1" value="55.0" min="0">
                </div>

                <div class="form-group">
                    <label>性別</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male" checked> 男性</label>
                        <label><input type="radio" name="gender" value="Female"> 女性</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sleep-time">睡眠時間 (時間)</label>
                    <input type="number" id="sleep-time" name="sleep_duration" class="form-control" step="0.1" value="7.5" min="0">
                </div>

                <div class="form-group">
                    <label for="exercise-time">運動時間 (分)</label>
                    <input type="number" id="exercise-time" name="physical_activity" class="form-control" value="60" min="0">
                </div>

                <div class="form-group">
                    <label for="stress-level">ストレスレベル</label>
                    <input type="number" id="stress-level" name="stress_level" class="form-control" value="3" min="0" max="10">
                </div>

                <div class="form-group">
                    <label for="age">安静時心拍数</label>
                    <input type="number" id="heart-rate" name="heart_rate" class="form-control" value="60" min="0">
                </div>

                <div class="form-group">
                    <label for="steps">歩数</label>
                    <input type="number" id="steps" name="daily_steps" class="form-control" value="8500" min="0">
                </div>

                <button type="submit" id="btn-submit" class="btn-submit">診断する</button>

                <!-- submitボタンに関するバリデーション機能 -->
                <script>
                    const height = document.getElementById("height");
                    const weight = document.getElementById("weight");
                    const sleep = document.getElementById("sleep-time");
                    const excercise = document.getElementById("exercise-time");
                    const stress = document.getElementById("stress-level");
                    const heart = document.getElementById("heart-rate");
                    const steps = document.getElementById("steps");
                    const button = document.getElementById("btn-submit");

                    function validateForm() {
                        if (height.value.trim() === ""
                         || weight.value.trim() === ""
                         || sleep.value.trim() === ""
                         || excercise.value.trim() === ""
                         || stress.value.trim() === ""
                         || heart.value.trim() === ""
                         || steps.value.trim() === "") {
                            button.disabled = true;
                        } else {
                            button.disabled = false;
                        }
                    }

                    // 初期表示時
                    validateForm();

                    // 入力時に監視                    
                    [
                        height,
                        weight,
                        sleep,
                        excercise,
                        stress,
                        heart,
                        steps
                    ].forEach(input => {
                        input.addEventListener(
                            "input",
                            validateForm
                        );
                    });
                </script>

            </form>
        </div>

    </div>

</body>

</html>
