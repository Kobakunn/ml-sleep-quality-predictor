<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>睡眠の質チェックアプリ</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <div class="container">
        
        <h1 style="color: blueviolet; margin-bottom: 20px; text-align: center;">睡眠の質チェックアプリ</h1>

        <div class="card">
            <div class="card-header">
                診断フォーム（以下記入欄に入力してください↓）
            </div>
            <form class="card-body" onsubmit="return false;">

                <div class="form-group">
                    <label for="bmi">身長</label>
                    <input type="number" id="height" class="form-control" step="0.1" value="171.1">
                </div>

                <div class="form-group">
                    <label for="bmi">体重</label>
                    <input type="number" id="weight" class="form-control" step="0.1" value="55.1">
                </div>

                <div class="form-group">
                    <label>性別</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male" checked> 男性</label>
                        <label><input type="radio" name="gender" value="female"> 女性</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sleep-time">睡眠時間 (時間)</label>
                    <input type="number" id="sleep-time" class="form-control" step="0.1" value="7.5">
                </div>

                <div class="form-group">
                    <label for="exercise-time">運動時間 (分)</label>
                    <input type="number" id="exercise-time" class="form-control" value="60">
                </div>

                <div class="form-group">
                    <label for="stress-level">ストレスレベル</label>
                    <input type="number" id="stress-level" class="form-control" value="3">
                </div>

                <div class="form-group">
                    <label for="age">安静時心拍数</label>
                    <input type="number" id="heart-rate" class="form-control" value="60">
                </div>

                <div class="form-group">
                    <label for="steps">歩数</label>
                    <input type="number" id="steps" class="form-control" value="8500">
                </div>

                <button type="submit" class="btn-submit">チェック</button>

            </form>
        </div>

    </div>

</body>

</html>
